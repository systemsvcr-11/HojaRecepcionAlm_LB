<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procesador de Requerimientos</title>
    <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.png') }}" type="image/png">

    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1e1e2f 0%, #2a2a40 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card-custom {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            padding: 2.5rem;
            max-width: 550px;
            width: 100%;
        }
        .upload-area {
            border: 2px dashed rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            padding: 25px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .upload-area:hover {
            border-color: #0d6efd;
            background: rgba(13, 110, 253, 0.05);
        }
        .form-select-custom {
            background-color: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            border-radius: 10px;
            padding: 10px 15px;
        }
        .form-select-custom:focus {
            background-color: #2a2a40;
            color: #fff;
            border-color: #0d6efd;
            box-shadow: none;
        }
        .form-select-custom option {
            background-color: #2a2a40;
            color: #fff;
        }
        .btn-custom {
            background: linear-gradient(45deg, #0d6efd, #00d4ff);
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .btn-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(13, 110, 253, 0.4);
        }
    </style>
</head>
<body>

<div class="card-custom text-center">
    <h2 class="mb-3"><i class="fa-solid fa-store text-info me-2"></i>Procesador de RQ</h2>
    <p class="text-secondary mb-4">Selecciona el local objetivo y sube tus archivos de Odoo.</p>

    <form action="/procesar" method="POST" enctype="multipart/form-data">
        
        <!-- Filtro Selector de Local -->
        <div class="text-start mb-3">
            <label for="local" class="form-label text-light small font-weight-bold">
                <i class="fa-solid fa-location-dot me-1 text-primary"></i> Seleccionar Local:
            </label>
            <select class="form-select form-select-custom w-100" id="local" name="local" required>
                <option value="La Benita" selected>La Benita</option>
                <option value="La Guardiana">La Guardiana</option>
                <option value="Centro de Producción">Centro de Producción</option>
            </select>
        </div>

        <!-- Zona de Carga de Archivos -->
        <div class="upload-area mb-3" id="drop-zone" onclick="document.getElementById('fileInput').click()">
            <i class="fa-solid fa-cloud-arrow-up fa-3x text-primary mb-2"></i>
            <h5>Haz clic o arrastra tus archivos aquí</h5>
            <p class="text-muted small mb-0">Formatos permitidos: .xlsx, .xls</p>
            <input type="file" id="fileInput" name="archivos" multiple accept=".xlsx, .xls" class="d-none" onchange="actualizarArchivos(this)">
        </div>

        <div id="file-list" class="text-start mb-3 text-info small"></div>

        <!-- Opciones de Formato -->
        <div class="row g-2 mb-4">
            <div class="col-6">
                <input type="radio" class="btn-check" name="formato" id="fmtExcel" value="excel" checked>
                <label class="btn btn-outline-light w-100 py-2" for="fmtExcel">
                    <i class="fa-regular fa-file-excel me-1 text-success"></i> Excel (.xlsx)
                </label>
            </div>
            <div class="col-6">
                <input type="radio" class="btn-check" name="formato" id="fmtPdf" value="pdf">
                <label class="btn btn-outline-light w-100 py-2" for="fmtPdf">
                    <i class="fa-regular fa-file-pdf me-1 text-danger"></i> PDF (.pdf)
                </label>
            </div>
        </div>

        <button type="submit" class="btn btn-primary btn-custom w-100">
            <i class="fa-solid fa-download me-2"></i>Procesar y Descargar
        </button>
    </form>
</div>

<script>
    function actualizarArchivos(input) {
        const fileList = document.getElementById('file-list');
        fileList.innerHTML = '';
        if (input.files.length > 0) {
            fileList.innerHTML = '<strong>Archivos seleccionados:</strong><ul>';
            for (let i = 0; i < input.files.length; i++) {
                fileList.innerHTML += `<li>${input.files[i].name}</li>`;
            }
            fileList.innerHTML += '</ul>';
        }
    }
</script>

</body>
</html>
